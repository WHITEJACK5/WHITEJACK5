name: refresh stats
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  # deliberately no `push`: this job commits, and a push trigger would
  # re-run it on its own commit
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install generator deps
        run: python -m pip install --quiet numpy
      - name: generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py
      - name: verify svgs are well-formed
        run: |
          for f in stats.svg streak.svg langs.svg year.svg hd/*.svg; do
            [ -e "$f" ] || continue
            python3 -c "import xml.etree.ElementTree as E,sys; E.parse(sys.argv[1])" "$f"
          done
